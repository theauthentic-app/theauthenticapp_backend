<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AUTHENTIC Verify</title>
  <style>
    :root { --bg:#07111c; --card:#0f1c2c; --line:#1f3348; --text:#e8eef6; --muted:#8ea0bb; --accent:#14b8a6; }
    body { margin:0; font-family: Inter, Segoe UI, sans-serif; background:var(--bg); color:var(--text); }
    main { max-width:560px; margin:0 auto; padding:28px 18px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px; }
    input, button { font: inherit; }
    input[type=text] { width:100%; padding:12px; border-radius:12px; border:1px solid var(--line); background:#0b1624; color:var(--text); }
    button { background:var(--accent); color:#06201c; border:0; border-radius:999px; padding:12px 18px; font-weight:700; width:100%; margin-top:12px; }
    .muted { color:var(--muted); font-size:14px; }
    .status { font-size:28px; font-weight:800; margin:8px 0; }
    .AUTHENTICATED { color:#34d399; } .SUSPICIOUS { color:#fbbf24; } .COMPROMISED,.RECALLED,.REVOKED { color:#f87171; }
    pre { white-space:pre-wrap; font-size:12px; color:var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1 style="margin-top:0">Check a product</h1>
      <p class="muted">Enter a code from the pack, or upload a barcode / QR photo. AUTHENTIC never says original or fake — it reports evidence.</p>
      <form id="form">
        <input id="code" name="code" type="text" placeholder="pid_… / serial / ISBN" />
        <input id="image" name="image" type="file" accept="image/*" capture="environment" />
        <button>Verify</button>
      </form>
      <div id="result"></div>
    </div>
  </main>
  <script>
    const API = '/api/v1';
    const params = new URLSearchParams(location.search);
    if (params.get('code')) document.getElementById('code').value = params.get('code');

    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const box = document.getElementById('result');
      box.innerHTML = '<p class="muted">Checking…</p>';
      try {
        const file = document.getElementById('image').files[0];
        const code = document.getElementById('code').value.trim();
        let data;
        if (file) {
          const fd = new FormData();
          fd.append('image', file);
          if (code) fd.append('code', code);
          fd.append('source', 'CAMERA');
          const res = await fetch(API + '/public/scan', { method: 'POST', body: fd });
          const body = await res.json();
          if (!res.ok) throw new Error(body.error?.message || 'Scan failed');
          data = body.data;
        } else {
          const res = await fetch(API + '/public/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code, source: 'MANUAL' }),
          });
          const body = await res.json();
          if (!res.ok) throw new Error(body.error?.message || 'Verify failed');
          data = body.data;
        }
        box.innerHTML = `
          <p class="status ${data.status}">${data.status}</p>
          <p class="muted">Trust score: ${data.trustScore ?? '—'}</p>
          <p>${data.product?.name || data.lookup?.title || 'No catalog title'}</p>
          <pre>${JSON.stringify(data, null, 2)}</pre>`;
      } catch (err) {
        box.innerHTML = `<p class="status COMPROMISED">${err.message}</p>`;
      }
    };

    if (params.get('code')) document.getElementById('form').requestSubmit();
  </script>
</body>
</html>
